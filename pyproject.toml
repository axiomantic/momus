[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momus"
version = "0.1.0"
description = "Multi-phase AI pull-request review."
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
momus = "momus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["momus"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-tripwire[all]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
