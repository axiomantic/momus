[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "momus"
version = "1.0.0"
description = "Multi-phase AI pull-request review."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
momus = "momus.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["momus"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-tripwire[all]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not adversarial'"
markers = [
  "unit: fast unit tests (default)",
  "integration: spawns pi or other subprocesses; slower; opt-in",
  "adversarial: full LLM corpus runs; cost-bounded; opt-in via -m adversarial",
]
