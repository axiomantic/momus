site_name: Momus
site_description: "Thorough AI code review as a GitHub Action."
site_url: https://axiomantic.github.io/momus/
repo_url: https://github.com/axiomantic/momus
repo_name: axiomantic/momus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            signature_crossrefs: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - toc: { permalink: true }
  - attr_list
  - md_in_html

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Usage: usage.md

# README.md predates mkdocs and documents the legacy /docs static-asset
# layout served directly via GitHub Pages. Once docs are published via
# mike + gh-pages, that README is meta/contributor info and should not
# appear as a site page. Exclude it (mkdocs auto-aliases README.md ->
# index.md, so leaving it in conflicts with our own index.md).
exclude_docs: |
  README.md

# install/index.html is a static asset (the App-manifest installer page)
# that ships under docs/install/. It is copied to the built site as-is
# but not part of the navigation tree.
not_in_nav: |
  install/*
