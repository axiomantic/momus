site_name: Momus
site_description: "Thorough AI code review as a GitHub Action."
site_url: https://axiomantic.github.io/momus/
repo_url: https://github.com/axiomantic/momus
repo_name: axiomantic/momus
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.code.annotate
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            merge_init_into_class: true
            show_if_no_docstring: false
            signature_crossrefs: true
            separate_signature: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tabbed: { alternate_style: true }
  - toc: { permalink: true }
  - attr_list
  - md_in_html

extra:
  version:
    provider: mike

nav:
  - Home: index.md
  - Tutorial:
      - First review: tutorial/first-review.md
  - How-to:
      - Configure blocking severities: how-to/configure-blocking-severities.md
      - Add convention files: how-to/add-convention-files.md
      - Configure emphasis: how-to/configure-emphasis.md
      - Set up the GitHub App: how-to/set-up-github-app.md
      - Use a different LLM provider: how-to/use-different-llm-provider.md
      - Tune cost vs thoroughness: how-to/tune-cost-vs-thoroughness.md
      - Debug a review: how-to/debug-a-review.md
      - Extend env passthrough: how-to/extend-env-passthrough.md
  - Reference:
      - Action inputs: reference/action-inputs.md
      - Config schema: reference/config-schema.md
      - Prompt tokens: reference/prompt-tokens.md
      - Emphasis modules: reference/emphasis-modules.md
      - CLI: reference/cli.md
  - Explanation:
      - Four-phase pipeline: explanation/four-phase-pipeline.md
      - Review philosophy: explanation/review-philosophy.md
      - Threat model: explanation/threat-model.md
      - Adversarial corpus: explanation/adversarial-corpus.md
  - Contributing:
      - Dev loop: contributing/dev-loop.md
      - Adversarial corpus: contributing/adversarial-corpus.md
      - Modifying prompts: contributing/modifying-prompts.md
      - Release process: contributing/release-process.md

# README.md predates mkdocs and documents the legacy /docs static-asset
# layout served directly via GitHub Pages. Once docs are published via
# mike + gh-pages, that README is meta/contributor info and should not
# appear as a site page. Exclude it (mkdocs auto-aliases README.md ->
# index.md, so leaving it in conflicts with our own index.md).
exclude_docs: |
  README.md

# install/index.html is a static asset (the App-manifest installer page)
# that ships under docs/install/. It is copied to the built site as-is
# but not part of the navigation tree.
not_in_nav: |
  install/*
