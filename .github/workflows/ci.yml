name: CI

# Lint, type-check, and run the non-adversarial Python suite plus the
# TypeScript extension suite on every PR to main and every push to main.
# Adversarial corpus runs are scheduled separately (see redteam-corpus.yml)
# so they don't gate ordinary work.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy momus tests

      - name: Tests (pytest, non-adversarial)
        run: uv run pytest -m 'not adversarial'

  # Separate job, not extra steps on lint-and-test: the TypeScript suite
  # shares no toolchain with the Python one, so pairing them would serialize
  # it behind `uv sync` and merge two independent red signals into one.
  typescript-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pi-coding-agent (pinned via package-lock.json)
        # The suite imports @mariozechner/pi-ai, a transitive dep of
        # pi-coding-agent. `npm ci` resolves both at the versions recorded in
        # package-lock.json; `npm install` could drift. There is no bun
        # lockfile, so `bun install` is deliberately not used here.
        run: npm ci --no-audit --no-fund

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Tests (bun)
        # No path argument: bun discovers every *.test.ts in the checkout and
        # excludes node_modules, so a suite added outside momus/extensions/ is
        # picked up without editing this workflow.
        run: bun test
