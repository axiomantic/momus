name: "Momus Code Review"
description: "Run pi-coding-agent against a PR diff and publish a GitHub Review."

inputs:
  pr_number:
    description: "Pull request number to review"
    required: true
  event:
    description: "Triggering event name (pull_request | issue_comment | workflow_dispatch)"
    required: true
  work_dir:
    description: "Working directory for inputs/, outputs/, prompts/"
    required: false
    default: ".momus"
  app_id:
    description: >-
      GitHub App ID (e.g. secrets.MOMUS_APP_ID). Pass together with
      private_key to make momus authenticate AS THE APP so APPROVE verdicts
      post as real approvals. Omit to fall back to the caller's GITHUB_TOKEN
      (APPROVE is then downgraded to COMMENT; see publish.py).
    required: false
    default: ""
  private_key:
    description: >-
      GitHub App private key PEM (e.g. secrets.MOMUS_APP_PRIVATE_KEY). Pass
      together with app_id. See app_id.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # Mint an App installation token when app_id + private_key are supplied.
    # gh reads GH_TOKEN before GITHUB_TOKEN, so exporting the installation
    # token below makes the review POST in publish.py authenticate AS THE
    # APP -- letting APPROVE verdicts post as real approvals instead of the
    # 422 -> COMMENT downgrade that the default Actions GITHUB_TOKEN (the
    # github-actions[bot] identity) forces. When the inputs are absent both
    # steps no-op and momus falls back to the caller's GITHUB_TOKEN.
    - name: Generate App installation token
      id: app-token
      if: ${{ inputs.app_id != '' && inputs.private_key != '' }}
      uses: actions/create-github-app-token@v1
      with:
        app-id: ${{ inputs.app_id }}
        private-key: ${{ inputs.private_key }}

    - name: Export App token as GH_TOKEN
      if: ${{ steps.app-token.outputs.token != '' }}
      shell: bash
      env:
        APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        # $GITHUB_ENV makes GH_TOKEN visible to every later step in this
        # composite action (the Run momus step's `gh` picks it up). The token
        # is already registered as a masked secret by create-github-app-token;
        # the explicit ::add-mask:: is belt-and-suspenders. Note: momus's pi
        # subprocess env is default-deny (invoke_pi._build_pi_env) and GH_TOKEN
        # is not on its allowlist, so the App token never reaches the LLM layer.
        echo "::add-mask::$APP_TOKEN"
        echo "GH_TOKEN=$APP_TOKEN" >> "$GITHUB_ENV"

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install pi-coding-agent (pinned via package-lock.json)
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # `npm ci` resolves @mariozechner/pi-coding-agent at exactly the
        # version recorded in package-lock.json (0.72.1), making the
        # action's behavior deterministic across runs. The pi binary is
        # available at ./node_modules/.bin/pi inside the action checkout.
        npm ci --no-audit --no-fund
        ./node_modules/.bin/pi --version
        # Expose the locally-installed pi binary on PATH for the Run momus
        # step. Use $GITHUB_PATH (which GHA prepends to PATH for all later
        # steps) instead of overriding PATH in the step env block, which
        # silently clobbers system bins like /usr/bin/gh.
        echo "${{ github.action_path }}/node_modules/.bin" >> "$GITHUB_PATH"

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install momus
      shell: bash
      run: |
        pip install "${{ github.action_path }}"

    - name: Run momus
      shell: bash
      env:
        # GITHUB_TOKEN is not auto-injected into composite action steps; the
        # caller workflow exposes secrets.GITHUB_TOKEN by setting it as env on
        # the `uses:` step that invokes this action. We compose GITHUB_RUN_URL
        # here from the github context so callers do not have to.
        # LLM_API_KEY / LLM_BASE_URL / LLM_MODEL are also expected to be set as
        # env on the calling `uses:` step. We never echo these.
        GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        OWNER="${GITHUB_REPOSITORY%%/*}"
        REPO="${GITHUB_REPOSITORY#*/}"
        momus \
          --owner "$OWNER" \
          --repo "$REPO" \
          --pr-number "${{ inputs.pr_number }}" \
          --event "${{ inputs.event }}" \
          --repo-root "${{ github.workspace }}" \
          --work-dir "${{ inputs.work_dir }}"

    - name: Upload momus artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: momus-${{ inputs.pr_number }}-${{ github.run_id }}
        path: |
          ${{ inputs.work_dir }}/inputs/
          ${{ inputs.work_dir }}/outputs/
        retention-days: 7
        if-no-files-found: ignore
